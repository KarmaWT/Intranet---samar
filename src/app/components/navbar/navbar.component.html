<header>
  <header class="app-header">
    <mat-toolbar>
      <div class="logo">
        <img src="../../../assets/logo branca.png" alt="logo rede samar" width="190px">
      </div>
      <li class="burger" (click)="toggleMenu()">
        <i class="material-icons">{{ isMenuOpen ? "close" : "menu" }}</i>
      </li>
      <span class="spacer"></span>
      <div class="menu" [class.is-open]="isMenuOpen">

        <!-- SEU BOTÃO ORIGINAL -->
        <button mat-button routerLink="/" class="menu-item">Inicio</button>

        <!--
          NOVO DROPDOWN 'SISTEMA MV' ADICIONADO AQUI
          Note que o nome 'sistemaMV' é novo e único
        -->
        <button mat-button class="menu-item" [matMenuTriggerFor]="sistemaMV">Sistemas MV</button>
        <mat-menu #sistemaMV="matMenu" class="sub-menu">
          <!--
            Usamos <a> (anchor tag) com href para links EXTERNOS.
            O 'target="_blank"' faz o link abrir em uma NOVA ABA.
          -->
          <a mat-menu-item class="menu-item sub-menu" href="https://9159prd.cloudmv.com.br/mvsacr" target="_blank">
            MV SACR
          </a>
          <a mat-menu-item class="menu-item sub-menu" href="https://9159prd.cloudmv.com.br/soul-mv/" target="_blank">
            MV SOUL
          </a>
          <a mat-menu-item class="menu-item sub-menu" href="https://9159prd.cloudmv.com.br/mvpep" target="_blank">
            MV PEP
          </a>
        </mat-menu>
        <!-- FIM DO NOVO DROPDOWN -->

        <button mat-button class="menu-item" routerLink="/radiologia">Radiologia</button>
        <button mat-button class="menu-item" routerLink="/enfermagem">Enfermagem</button>

        <!-- SEU DROPDOWN ANTIGO -->
        <button mat-button class="menu-item" [matMenuTriggerFor]="compras">Sistemas Administrativos</button>
        <mat-menu #compras="matMenu" class="sub-menu">
          <button  mat-menu-item class="menu-item sub-menu" routerLink="/compras">Compras</button>
          <button  mat-menu-item class="menu-item">Outros</button>
        </mat-menu>

        <button mat-button color="primary" class="menu-item" routerLink="/laboratorio">Laboratório</button>
      </div>
      </mat-toolbar>
  </header>
</header>
